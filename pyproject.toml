[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aliexpress-coins"
description = "Unattended collector for the AliExpress in-app coins programme."
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version", "dependencies"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aliexpress_coins = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "aliexpress_coins.__version__" }
# requirements.txt stays the single source of truth for runtime pins.
dependencies = { file = ["requirements.txt"] }

# --- ruff -------------------------------------------------------------------
# The formatter owns wrapping, so E501 is off; line length still guides it.
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
# tools/ holds the issue-filing scripts written before the scaffold. They are
# not part of the package and contain intentional prose punctuation (×, –, …).
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
mypy_path = "src"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
show_error_context = true
pretty = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=aliexpress_coins",
    "--cov-report=term-missing",
]
markers = [
    "slow: builds large synthetic frames or walks long transcripts; excluded from `just check-fast`",
]

# --- coverage ratchet -------------------------------------------------------
# The floor is a ratchet: start at 85% on the stub, raise it as modules land,
# and never lower it to make a change pass. Raised to 98 when the perception
# capture module landed (measured 98.45%), then to 98.8 when the daily state
# store landed (measured 98.87%), then to 99.0 when the daily sign-in executor
# landed (measured 99.01%), then to 99.1 when the browse-and-wait executor
# landed (measured 99.11%), then to 99.15 when the notifications executor
# landed (measured 99.20%), then to 99.2 when the roster observation log
# landed (measured 99.25%), then to 99.25 when the nightly runner landed
# (measured 99.31%). Raised to 99.3 when the failure taxonomy, retries and
# device hygiene landed (measured 99.31%), then to 99.31 when Apprise
# notifications and log levels landed (measured 99.32%), then to 99.32 when
# geometry independence landed (measured 99.33%), then to 99.33 when the
# dispatch gate and abort conditions landed (measured 99.33%), then to 99.35
# when abort propagation through executor/cleanup handlers landed (measured
# 99.36%), then to 99.37 when the inside-task countdown band was narrowed
# (measured 99.38%), then to 99.39 when the wait primitives landed (measured
# 99.40%). See "Quality gate" in README.md.
[tool.coverage.run]
branch = true
source = ["aliexpress_coins"]

[tool.coverage.report]
fail_under = 99.39
precision = 2
show_missing = true
skip_covered = true
