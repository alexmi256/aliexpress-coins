name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      # Code scanning needs GitHub Code Security on a private repository. This
      # repository is private on a personal account until the #41 release gate,
      # so the step is installed but non-blocking while it cannot upload SARIF.
      # Once the repository is public, `github.event.repository.private` is false
      # and the same step becomes blocking with no workflow change.
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        continue-on-error: ${{ github.event.repository.private }}

      - name: Explain the non-blocking analysis
        if: steps.analyze.outcome == 'failure' && github.event.repository.private
        run: |
          echo "::warning title=CodeQL unavailable::GitHub Code Security is not enabled for this private personal repository. The analysis becomes blocking when the repository is public (#41)."
