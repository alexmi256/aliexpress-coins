name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `v5` is a branch in this action's repository, not a floating tag, so
      # the newest release tag is pinned directly until a v5 tag exists.
      #
      # Dependency review needs GitHub Code Security on a private repository.
      # This repository is private on a personal account until the #41 release
      # gate, so the step is installed but non-blocking while the dependency
      # review API is unavailable. Once public, it becomes blocking.
      - name: Review dependency changes
        id: review
        uses: actions/dependency-review-action@v5.0.1
        continue-on-error: ${{ github.event.repository.private }}
        with:
          fail-on-severity: high

      - name: Explain the non-blocking review
        if: steps.review.outcome == 'failure' && github.event.repository.private
        run: |
          echo "::warning title=Dependency review unavailable::GitHub Code Security is not enabled for this private personal repository. The check becomes blocking when the repository is public (#41)."
