name: Container image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/alexmi256/aliexpress-coins

jobs:
  build:
    name: Build and smoke-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve the short tag
        id: tag
        run: echo "name=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Pull requests build and load the image locally, but never log in to or
      # push to a registry.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # AECOINS_DEVICE is deliberately unset: doctor reports the device check
      # as skipped, so this proves the image without hardware.
      - name: Smoke-test the image
        run: docker run --rm "$IMAGE:${{ steps.tag.outputs.name }}" python -m aliexpress_coins doctor

  publish:
    name: Publish and smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve the short tag
        id: tag
        run: echo "name=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull what was actually published, then run doctor with AECOINS_DEVICE
      # unset so the device check skips instead of reaching for the tablet.
      - name: Pull the published image
        run: docker pull "$IMAGE:${{ steps.tag.outputs.name }}"

      - name: Smoke-test the published image
        run: docker run --rm "$IMAGE:${{ steps.tag.outputs.name }}" python -m aliexpress_coins doctor
